name: Deploy

# 照 x-console 的做法：推送到 main（或在 Actions 页面手动运行）时，
# 检查（go vet + 构建）和构建镜像同时跑 → 都成功后 SSH 到服务器跑 deploy/remote-deploy.sh，并把镜像标成 latest。
# 服务器相关的 Secrets 没配置时只构建不部署。配置方法见 deploy/README.md。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 前端在镜像里构建；这里放一个占位让 embed 有东西
      - run: mkdir -p web/dist && cp web/placeholder.html web/dist/index.html
      - run: go vet ./... && go build ./...

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ env.IMAGE }}:sha-${{ steps.version.outputs.short }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.version.outputs.short }}
          tags: ${{ env.IMAGE }}:sha-${{ steps.version.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  latest:
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create -t "$IMAGE:latest" "${{ needs.image.outputs.ref }}"

  deploy:
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || 'x-studio' }}
    steps:
      - name: Check deploy settings
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::notice::没有配置 DEPLOY_HOST / DEPLOY_USER，跳过部署。镜像已推送：${{ needs.image.outputs.ref }}"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
      - name: Set up SSH
        if: steps.check.outputs.enabled == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "STRICT=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::没有配置 DEPLOY_KNOWN_HOSTS，首次连接会自动信任服务器指纹。"
            echo "STRICT=accept-new" >> "$GITHUB_ENV"
          fi
      - name: Upload deploy files
        if: steps.check.outputs.enabled == 'true'
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=$STRICT"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o StrictHostKeyChecking=$STRICT \
            deploy/docker-compose.yml deploy/Caddyfile deploy/remote-deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Deploy
        if: steps.check.outputs.enabled == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XS_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          IMAGE_REF: ${{ needs.image.outputs.ref }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=$STRICT"
          printf '%s' "$REGISTRY_TOKEN" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          # AI_API_KEY 只在第一次生成 .env 时用到；之后在服务器的 .env 里改
          printf '%s' "$AI_API_KEY" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" "AI_API_KEY=\$(cat) XS_DOMAIN='$XS_DOMAIN' sh '$DEPLOY_PATH/remote-deploy.sh' '$IMAGE_REF'"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "docker logout ghcr.io" || true
