<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>详情页 · 深蓝烫金</title>
<!-- 风格 1「深蓝烫金」，全店默认模板。用法见 引擎.js 开头；风格清单见 模板清单.json -->
<link rel="stylesheet" href="公共.css">
<style>
:root{ --navy:#1A2340; --navy-2:#232E52; --gold:#C9A465; --gold-soft:#E3CFA6;
  --ivory:#F6F0E6; --paper:#FBF8F3; --ink:#2B2B2B; --ink-2:#6B6459; --line:#E4DACB; }
body{color:var(--ink)}
.pad{padding:96px 64px}
.dark{background:var(--navy);color:var(--ivory)} .alt{background:var(--ivory)} .base{background:#fff} .base2{background:var(--paper)}
.ph{background:#EDE6DA} .dark .ph{background:var(--navy-2)}
.stamp,.mm{background:rgba(26,35,64,.75);font-family:var(--latin)}

.eyebrow{font-family:var(--latin);font-size:22px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
.h2{font-family:var(--serif);font-weight:600;font-size:52px;line-height:1.3;margin-top:18px;letter-spacing:.04em}
.lead{font-size:26px;line-height:1.75;color:var(--ink-2);margin-top:20px}
.dark .lead{color:#C9CCD8}
.rule{width:56px;height:2px;background:var(--gold);margin-top:28px}
.center .rule{margin-left:auto;margin-right:auto}

.s-hero .top{display:flex;justify-content:space-between;align-items:center;padding:44px 64px 0}
.s-hero .series{font-family:var(--serif);font-size:24px;color:var(--gold-soft);letter-spacing:.2em}
.s-hero .frame{margin:40px 64px 0;padding:14px;border:1px solid rgba(201,164,101,.55)}
.s-hero .frame .ph{height:760px}
.s-hero .name{font-family:var(--serif);font-weight:600;font-size:76px;letter-spacing:.12em;margin-top:64px}
.s-hero .en{font-family:var(--latin);font-size:26px;letter-spacing:.42em;color:var(--gold);margin-top:14px}
.s-hero .one{font-family:var(--serif);font-size:30px;line-height:1.7;color:#D9DCE6;margin:36px 64px 0}
.s-hero .tags{display:flex;justify-content:center;gap:16px;padding:44px 0 88px}
.s-hero .tags span{border:1px solid var(--gold);color:var(--gold-soft);font-size:24px;padding:10px 22px;letter-spacing:.08em}

.s-real .tray .ph{height:560px;margin-top:56px}
.s-real .cap{font-size:22px;color:var(--ink-2);margin-top:14px;text-align:center}
.cmp{margin-top:56px;border-top:2px solid var(--navy)}
.cmp .row{display:grid;grid-template-columns:96px 1.15fr 1fr 1fr;border-bottom:1px solid var(--line)}
.cmp .row>div{padding:22px 12px;font-size:23px;line-height:1.55}
.cmp .row>div:first-child{padding-left:0}
.cmp .k{font-family:var(--serif);font-weight:600;color:var(--navy)}
.cmp .head>div{font-size:21px;line-height:1.4;color:var(--ink-2);padding-top:18px;padding-bottom:18px}
.cmp .head .ours{color:var(--navy);font-weight:700}
.cmp .ours{color:var(--ink);background:rgba(201,164,101,.10)}
.cmp .fake{color:#9A9286}
.s-real .note{margin-top:40px;font-size:23px;line-height:1.7;color:var(--ink-2);background:#fff;padding:24px 28px;border-left:3px solid var(--gold)}

.detail{margin-top:64px}
.detail .ph{height:460px}
.detail .txt{display:flex;gap:24px;align-items:baseline;margin-top:24px}
.detail .no{font-family:var(--latin);font-size:44px;color:var(--gold);line-height:1}
.detail .t{font-family:var(--serif);font-weight:600;font-size:32px;color:var(--navy)}
.detail .d{font-size:24px;line-height:1.7;color:var(--ink-2);margin-top:8px}

.s-wear .big{margin-top:56px} .s-wear .big .ph{height:820px}
.s-wear .grid2{margin-top:16px} .s-wear .grid2 .ph{height:440px}
.fig-cap{font-size:22px;color:var(--ink-2);text-align:center;margin-top:12px}

.s-size .ruler{margin-top:56px} .s-size .ruler .ph{height:500px}
.s-size .grid2{margin-top:56px;gap:24px 16px} .s-size .grid2 .ph{height:400px}
.params{margin-top:48px;border-top:2px solid var(--navy)}
.params .row{display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid var(--line);font-size:26px}
.params .row>div{padding:22px 0;line-height:1.5}
.params .k{color:var(--ink-2)}
.s-size .tip{margin-top:28px;font-size:22px;color:var(--ink-2);line-height:1.7}

.series-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 20px;margin-top:56px}
.card .ph{height:360px}
.card .n{font-family:var(--serif);font-weight:600;font-size:28px;margin-top:18px;color:var(--navy)}
.card .x{font-size:22px;color:var(--ink-2);margin-top:6px;line-height:1.5}

.s-pack .ph{height:640px;margin-top:56px}
.s-pack .items{display:grid;grid-template-columns:repeat(3,1fr);margin-top:48px;border-top:1px solid rgba(201,164,101,.4);border-bottom:1px solid rgba(201,164,101,.4)}
.s-pack .items div{padding:30px 10px;text-align:center;font-family:var(--serif);font-size:26px;color:var(--gold-soft)}
.s-pack .items div+div{border-left:1px solid rgba(201,164,101,.4)}

.s-care .block{margin-top:56px}
.s-care .bt{font-family:var(--serif);font-weight:600;font-size:34px;color:var(--navy);padding-bottom:16px;border-bottom:2px solid var(--navy)}
.s-care ol{list-style:none;counter-reset:c}
.s-care li{counter-increment:c;display:grid;grid-template-columns:60px 1fr;padding:22px 0;border-bottom:1px solid var(--line);font-size:25px;line-height:1.65}
.s-care li::before{content:counter(c,decimal-leading-zero);font-family:var(--latin);color:var(--gold);font-size:28px}

.s-about .logo{width:300px;height:auto;margin:0 auto}
.s-about .txt{font-family:var(--serif);font-size:28px;line-height:2;color:#D9DCE6;margin-top:48px;text-align:center}
.s-about .sign{margin-top:56px;font-family:var(--latin);letter-spacing:.42em;font-size:22px;color:var(--gold);text-align:center}
</style>
</head>
<body>
<div id="page"></div>
<script src="引擎.js"></script>
<script>XS.run({});</script>
</body>
</html>
