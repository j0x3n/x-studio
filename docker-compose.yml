# 本机 Docker：bash deploy/local-update.sh 构建并启动，打开 http://127.0.0.1:8080
# 变量从仓库根目录的 .env 读（和以前直接跑 exe 用的是同一份）。
# 数据在卷 x-studio_app-data 里；第一次运行 local-update.sh 时会把 ./data 复制进去，之后 ./data 不再使用。
# 服务器部署用 deploy/docker-compose.yml，见 deploy/README.md。
name: x-studio
services:
  app:
    image: x-studio:local
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:?请在 .env 设置至少 32 字符的 SESSION_SECRET}"
      AI_BASE_URL: "${AI_BASE_URL:-https://subapi.xcc.im/v1}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL_VISION: "${AI_MODEL_VISION:-gpt-6-sol}"
      AI_MODEL_TEXT: "${AI_MODEL_TEXT:-gpt-6-sol}"
      AI_REASONING_EFFORT: "${AI_REASONING_EFFORT-medium}"
      IMAGE_MODEL: "${IMAGE_MODEL:-gpt-image-2.5-burst}"
      IMAGE_TIMEOUT: "${IMAGE_TIMEOUT:-240}"
      AUTO_UPSCALE: "${AUTO_UPSCALE:-1}"
      AUTO_FILL: "${AUTO_FILL:-1}"
      UPSCALE_MIN_SIDE: "${UPSCALE_MIN_SIDE:-900}"
      # 不用 rembg 抠图服务（都走 GPT），像素锁定抠图用普通方式
      REMBG_URL: ""
      COOKIE_SECURE: "0"
      WORKERS: "${WORKERS:-2}"
    volumes:
      - app-data:/app/data
      # 提示词直接用仓库里的，改了不用重建镜像
      - ./prompts:/app/prompts:ro
    shm_size: "512mb"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  app-data:
