# 服务器上用的 compose（GitHub Actions 把它和 remote-deploy.sh、Caddyfile 传到服务器的部署目录）。
# 程序只监听服务器本机 127.0.0.1:${XS_PORT}，HTTPS 由反向代理负责：
#   服务器上已经有 Caddy / Nginx：把域名反代到 127.0.0.1:${XS_PORT}
#   没有反向代理：.env 里加 COMPOSE_PROFILES=caddy，用下面自带的 Caddy
services:
  app:
    image: ${XS_IMAGE:-ghcr.io/j0x3n/x-studio:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # 不用 rembg 抠图服务（都走 GPT），像素锁定抠图用普通方式
      REMBG_URL: ""
    volumes:
      - xs-data:/app/data
    ports:
      - "127.0.0.1:${XS_PORT:-17390}:8080"
    shm_size: "512mb"
    # Chromium 出详情图比较吃内存；防止异常时拖垮整台服务器
    mem_limit: ${XS_MEM_LIMIT:-900m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }


  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - XS_DOMAIN=${XS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # 数据库和全部图片都在这个卷里，部署前的数据库备份在卷里的 backups/
  xs-data:
  caddy-data:
