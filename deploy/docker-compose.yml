# 服务器上用的 compose（GitHub Actions 把它和 remote-deploy.sh、Caddyfile 传到服务器的部署目录）。
# 程序只监听服务器本机 127.0.0.1:${XS_PORT}，HTTPS 由反向代理负责：
#   服务器上已经有 Caddy / Nginx：把域名反代到 127.0.0.1:${XS_PORT}
#   没有反向代理：.env 里加 COMPOSE_PROFILES=caddy，用下面自带的 Caddy
# rembg（抠图服务，镜像 4 GB）默认不启动，只有可选的像素锁定抠图用它，没有时自动退回普通抠图；
#   服务器空间够时 .env 里 COMPOSE_PROFILES=rembg（和 caddy 一起用写成 caddy,rembg）
services:
  app:
    image: ${XS_IMAGE:-ghcr.io/j0x3n/x-studio:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      REMBG_URL: http://rembg:7000
    volumes:
      - xs-data:/app/data
    ports:
      - "127.0.0.1:${XS_PORT:-17390}:8080"
    shm_size: "512mb"
    # Chromium 出详情图比较吃内存；防止异常时拖垮整台服务器
    mem_limit: ${XS_MEM_LIMIT:-900m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  rembg:
    image: danielgatis/rembg:latest
    profiles: ["rembg"]
    command: ["s", "--host", "0.0.0.0", "--port", "7000"]
    restart: unless-stopped
    volumes:
      - rembg-models:/root/.u2net
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - XS_DOMAIN=${XS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # 数据库和全部图片都在这个卷里，部署前的数据库备份在卷里的 backups/
  xs-data:
  rembg-models:
  caddy-data:
