<!doctype html>
<html lang="zh-CN" data-style="workspace" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 珠光秘境出图</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="f" autocomplete="on">
    <div class="brand-row"><span class="rail-logo"><i data-lucide="gem"></i></span><div><h1>珠光秘境 · 出图</h1><div class="fs-12 t3">上传实拍图，自动生成主图和详情页</div></div></div>
    <div><label class="label" for="u">账号</label><input class="input" id="u" name="username" autocomplete="username" required autofocus></div>
    <div><label class="label" for="p">密码</label><input class="input" id="p" name="password" type="password" autocomplete="current-password" required></div>
    <div class="err" id="err"></div>
    <button class="btn btn-primary btn-block" id="go" type="submit">登录</button>
    <div class="fs-12 t3">没有账号请找管理员开通。</div>
  </form>
</div>
<script src="/js/lucide.min.js"></script>
<script src="/js/api.js"></script>
<script>
App.icons();
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    await App.API.post('/api/login', { username: u.value.trim(), password: p.value });
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
  } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
};
</script>
</body>
</html>
