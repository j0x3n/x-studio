<!doctype html>
<html lang="zh-CN" data-style="workspace" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编辑款 · X Studio</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <div class="shell">
    <nav class="rail"></nav>
    <div class="main white">
      <header class="topbar" style="padding-left:12px">
        <a class="btn btn-secondary btn-icon" href="/" title="返回款式列表"><i data-lucide="chevron-left"></i></a>
        <div style="margin-left:4px;min-width:0">
          <div class="crumbs">款式<span class="sep"></span><span class="mono" id="pid"></span></div>
          <div class="topbar-title ellipsis" id="title">…</div>
        </div>
        <span id="statusPill" style="margin-left:8px"></span>
        <span class="status-note hidden" id="dirtyNote" style="margin-left:4px">有改动，重新生成后生效</span>
        <span class="grow"></span>
        <a class="btn btn-secondary hidden" id="dlBtn"><i data-lucide="download"></i>下载全部</a>
        <button class="btn btn-primary" id="runBtn"><i data-lucide="sparkles"></i>一键生成</button>
      </header>

      <div class="row" style="flex:1;min-height:0;align-items:stretch;gap:0">
        <!-- 左：照片库 -->
        <aside class="subnav">
          <label class="drop" id="drop">
            <i data-lucide="upload"></i><b>上传实拍图</b><span>拖进来或点这里 · jpg / png / webp · 可多张</span>
            <input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
          </label>
          <div class="group-head">已用上<span class="end mono" id="usedN">0</span></div>
          <div class="thumbs" id="used"></div>
          <div class="group-head" id="unusedHead">没用上<span class="end mono" id="unusedN">0</span></div>
          <div class="thumbs" id="unused"></div>
          <a class="fs-12 t3" href="/help.html" target="_blank" style="margin-top:auto;display:inline-flex;gap:4px;align-items:center"><i data-lucide="book-open" style="width:14px;height:14px"></i>上游该拍哪几张？</a>
        </aside>

        <!-- 中：结果预览 -->
        <section class="canvas" id="canvas">
          <div class="canvas-bar">
            <div class="segmented" id="view">
              <button data-v="m34" class="active">主图 3:4</button><button data-v="m11">主图 1:1</button><button data-v="white">白底图</button><button data-v="detail">详情页</button><button data-v="live">实时预览</button>
            </div>
            <span class="grow"></span>
            <div class="steps" id="steps"></div>
          </div>
          <div class="canvas-inner" id="stage"></div>
        </section>

        <!-- 右：配置 -->
        <aside class="inspector">
          <div class="inspector-head"><div class="segmented block" id="itab"><button data-t="photo" class="active">照片</button><button data-t="copy">文案</button><button data-t="listing">标题规格</button></div></div>
          <div class="inspector-body" id="ibody"></div>
          <div class="inspector-foot" id="ifoot"></div>
        </aside>
      </div>
    </div>
  </div>
</div>
<script src="/js/lucide.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/product.js"></script>
<script src="/js/product-inspector.js"></script>
</body>
</html>
