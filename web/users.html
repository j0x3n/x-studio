<!doctype html>
<html lang="zh-CN" data-style="workspace" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账号 · X Studio</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <div class="shell">
    <nav class="rail"></nav>
    <div class="main">
      <header class="topbar"><div><div class="crumbs">X Studio</div><div class="topbar-title">账号</div></div></header>
      <div class="scroll"><main class="content">
        <div class="page-head">
          <div><div class="page-title">账号</div><div class="page-sub" id="summary"></div></div>
          <button class="btn btn-primary" id="newBtn"><i data-lucide="user-plus"></i>新建账号</button>
        </div>
        <div class="panel" style="padding:0"><div class="table-wrap"><table class="table">
          <thead><tr><th>账号</th><th>角色</th><th>状态</th><th>创建时间</th><th style="width:160px"></th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div></div>
        <div class="fs-12 t3">员工能看所有款，只能改和删自己建的。管理员什么都能做。停用后不能登录，建过的款保留。</div>
      </main></div>
    </div>
  </div>
</div>
<script src="/js/lucide.min.js"></script>
<script src="/js/api.js"></script>
<script>
const { API, esc, ago, icons, toast, drawer } = App;
let me = null, users = [];
const ROLE = { admin: '管理员', staff: '员工' };

function render() {
  document.getElementById('summary').innerHTML = `${users.length} 个账号<span class="sep"></span>${users.filter(u => u.disabled).length} 个已停用`;
  document.getElementById('rows').innerHTML = users.map(u => `<tr>
    <td><div class="name-cell"><span class="avatar">${esc(u.username.slice(0, 2).toUpperCase())}</span><span class="cell-title">${esc(u.username)}</span>${u.id === me.id ? '<span class="chip neutral">我</span>' : ''}</div></td>
    <td>${u.role === 'admin' ? '<span class="pill pill-primary">管理员</span>' : '<span class="pill pill-neutral">员工</span>'}</td>
    <td>${u.disabled ? '<span class="pill dot pill-danger">已停用</span>' : '<span class="pill dot pill-success">正常</span>'}</td>
    <td class="t3">${esc(ago(u.created_at))}</td>
    <td style="text-align:right"><button class="btn btn-secondary btn-sm" data-edit="${u.id}"><i data-lucide="pencil"></i>修改</button></td></tr>`).join('');
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(users.find(u => u.id === +b.dataset.edit)));
  icons();
}

async function load() {
  try { users = (await API.get('/api/users')).users || []; render(); } catch (e) { toast(e.message, 'error'); }
}

function edit(u) {
  const isNew = !u;
  drawer(`<div class="drawer-head">${isNew ? '新建账号' : '修改账号 · ' + esc(u.username)}<button class="close-btn" data-close><i data-lucide="x"></i></button></div>
    <form class="drawer-body" id="uf" autocomplete="off">
      ${isNew ? '<div><label class="label req">账号</label><input class="input" name="username" required pattern="[A-Za-z0-9_.\\-]{2,32}" title="2–32 位字母、数字、下划线"></div>' : ''}
      <div><label class="label${isNew ? ' req' : ''}">${isNew ? '密码' : '新密码（不改就留空）'}</label><input class="input" name="password" type="password" minlength="8" ${isNew ? 'required' : ''} autocomplete="new-password"></div>
      <div><label class="label">角色</label><select class="input" name="role"><option value="staff">员工</option><option value="admin">管理员</option></select></div>
      ${isNew ? '' : `<div class="setting"><div class="grow"><div class="title">停用</div><div class="desc">停用后不能登录</div></div><input type="checkbox" class="switch" name="disabled"${u.disabled ? ' checked' : ''}${u.id === me.id ? ' disabled' : ''}></div>`}
      <div class="fs-12 t3">密码至少 8 位。建好后把账号和密码私下发给员工，让他登录后自己保管。</div>
    </form>
    <div class="drawer-foot"><button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="save">${isNew ? '创建' : '保存'}</button></div>`,
    (el, close) => {
      const f = el.querySelector('#uf');
      f.role.value = isNew ? 'staff' : u.role;
      if (!isNew && u.id === me.id) f.role.disabled = true;
      el.querySelector('#save').onclick = async () => {
        if (!f.reportValidity()) return;
        const body = { role: f.role.value };
        if (f.password.value) body.password = f.password.value;
        try {
          if (isNew) { body.username = f.username.value.trim(); await API.post('/api/users', body); }
          else { body.disabled = f.disabled ? f.disabled.checked : false; await API.patch('/api/users/' + u.id, body); }
          toast('已保存', 'ok'); close(); load();
        } catch (e) { toast(e.message, 'error'); }
      };
    });
}
document.getElementById('newBtn').onclick = () => edit(null);
(async () => {
  me = await App.shell('users');
  if (!me) return;
  if (me.role !== 'admin') { location.href = '/'; return; }
  load();
})();
</script>
</body>
</html>
